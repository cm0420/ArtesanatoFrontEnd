<header class="bg-grafite border-b-[6px] border-dourado px-4 sm:px-6 py-4 sm:py-5 flex items-center justify-between">
  <a routerLink="/" class="font-display uppercase tracking-wide text-osso text-xl sm:text-2xl hover:text-dourado transition-colors">
    Barro &amp; Vinil
  </a>

  <div class="flex items-center gap-2 sm:gap-3">
    @if (isAuthenticated()) {
      <a
        routerLink="/carrinho"
        class="relative flex items-center justify-center h-11 w-11 rounded-lg border border-dourado text-dourado hover:bg-dourado hover:text-grafite transition-colors"
        aria-label="Carrinho"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3,4 H5 L7.5,15 H18 L21,7 H6" />
          <circle cx="9" cy="20" r="1.5" />
          <circle cx="17" cy="20" r="1.5" />
        </svg>
        @if (itemCount() > 0) {
          <span
            class="absolute -top-1.5 -right-1.5 flex items-center justify-center h-5 min-w-5 px-1 rounded-full bg-terracota text-osso font-mono text-[10px] font-semibold"
          >
            {{ itemCount() }}
          </span>
        }
      </a>
      <a
        routerLink="/cliente"
        aria-label="Minha conta"
        class="flex items-center justify-center sm:justify-start gap-2 h-11 w-11 sm:w-auto font-mono text-xs uppercase tracking-wide text-dourado border border-dourado rounded-lg sm:px-4 hover:bg-dourado hover:text-grafite transition-colors"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0">
          <circle cx="12" cy="8" r="4" />
          <path d="M4,21 C4,16 8,13 12,13 C16,13 20,16 20,21" />
        </svg>
        <span class="hidden sm:inline">Minha conta</span>
      </a>
    } @else {
      <a
        routerLink="/login"
        class="flex items-center h-11 font-mono text-xs uppercase tracking-wide text-dourado border border-dourado rounded-lg px-4 hover:bg-dourado hover:text-grafite transition-colors"
      >
        Entrar
      </a>
    }
  </div>
</header>
