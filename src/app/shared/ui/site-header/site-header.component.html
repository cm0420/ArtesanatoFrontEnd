<header class="glass sticky top-0 z-40 border-b border-hairline/80">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 sm:h-[72px] flex items-center justify-between">
  <a routerLink="/" class="font-display text-ink text-2xl sm:text-[28px] hover:text-forest transition-colors">
    Barro &amp; Vinil
  </a>

  <nav class="flex items-center gap-2 sm:gap-3" aria-label="Conta">
    @if (isAuthenticated()) {
      <a
        routerLink="/carrinho"
        class="relative flex items-center justify-center h-11 w-11 rounded-full border border-hairline bg-surface/70 text-ink hover:border-forest hover:text-forest"
        [attr.aria-label]="itemCount() > 0 ? 'Carrinho, ' + itemCount() + ' itens' : 'Carrinho'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M3,4 H5 L7.5,15 H18 L21,7 H6" />
          <circle cx="9" cy="20" r="1.5" />
          <circle cx="17" cy="20" r="1.5" />
        </svg>
        @if (itemCount() > 0) {
          <span
            class="absolute -top-1 -right-1 flex items-center justify-center h-5 min-w-5 px-1 rounded-full bg-forest text-canvas font-body text-[11px] font-semibold"
            aria-hidden="true"
          >
            {{ itemCount() }}
          </span>
        }
      </a>
      <a
        routerLink="/cliente"
        aria-label="Minha conta"
        class="flex items-center justify-center sm:justify-start gap-2 h-11 w-11 sm:w-auto font-body text-sm font-medium text-canvas bg-ink rounded-full sm:px-5 hover:bg-espresso"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="shrink-0" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4,21 C4,16 8,13 12,13 C16,13 20,16 20,21" />
        </svg>
        <span class="hidden sm:inline">Minha conta</span>
      </a>
    } @else {
      <a
        routerLink="/login"
        class="flex items-center h-11 font-body text-sm font-medium text-canvas bg-ink rounded-full px-5 hover:bg-espresso"
      >
        Entrar
      </a>
    }
  </nav>
  </div>
</header>
