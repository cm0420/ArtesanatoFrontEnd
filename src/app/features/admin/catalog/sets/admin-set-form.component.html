<div class="min-h-screen bg-osso bg-leaves">
  <app-admin-header />

  <main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <app-back-link to="/admin/conjuntos" label="Conjuntos" />

    <h1 class="font-display uppercase tracking-wide text-4xl text-grafite mb-8">
      {{ isEditing() ? 'Editar conjunto' : 'Novo conjunto' }}
    </h1>

    @if (loading()) {
      <p class="font-mono text-base text-grafite/60">Carregando…</p>
    } @else {
      @if (errorMessage()) {
        <p class="font-mono text-sm text-vinho border border-vinho/30 bg-vinho/5 rounded-lg px-3 py-2 mb-6">
          {{ errorMessage() }}
        </p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white border border-areia rounded-2xl p-5 sm:p-8 flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Nome</label>
          <input
            type="text"
            formControlName="name"
            class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Descrição</label>
          <textarea
            formControlName="description"
            rows="3"
            class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota resize-none"
          ></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Preço do conjunto (R$)</label>
          <input
            type="number"
            step="0.01"
            formControlName="price"
            class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Peças incluídas</label>
          <div class="flex flex-col gap-2 max-h-80 overflow-y-auto border border-areia rounded-lg p-3">
            @for (piece of availablePieces(); track piece.id) {
              <label class="flex items-center justify-between gap-3 py-1.5 cursor-pointer">
                <span class="flex items-center gap-2">
                  <input
                    type="checkbox"
                    [checked]="selectedPieceIds().has(piece.id)"
                    (change)="togglePiece(piece.id)"
                    class="accent-terracota"
                  />
                  <span class="font-body text-grafite">{{ piece.name }}</span>
                </span>
                <span class="font-mono text-sm text-grafite/50">{{ piece.price | currency: 'BRL' }}</span>
              </label>
            }
          </div>
        </div>

        <button
          type="submit"
          [disabled]="submitting()"
          class="mt-2 font-display uppercase tracking-wide text-base px-7 py-3.5 rounded-lg border-2 border-grafite bg-terracota text-osso font-semibold disabled:opacity-60"
        >
          {{ submitting() ? 'Salvando…' : isEditing() ? 'Salvar alterações' : 'Criar conjunto' }}
        </button>
      </form>
    }
  </main>
</div>
