<div class="min-h-screen bg-osso bg-leaves">
  <app-admin-header />

  <main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <app-back-link to="/admin/pecas" label="Peças" />

    <h1 class="font-display uppercase tracking-wide text-4xl text-grafite mb-8">
      {{ isEditing() ? 'Editar peça' : 'Nova peça' }}
    </h1>

    @if (loading()) {
      <p class="font-mono text-base text-grafite/60">Carregando…</p>
    } @else {
      @if (errorMessage()) {
        <p class="font-mono text-sm text-vinho border border-vinho/30 bg-vinho/5 rounded-lg px-3 py-2 mb-6">
          {{ errorMessage() }}
        </p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white border border-areia rounded-2xl p-5 sm:p-8 flex flex-col gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Nome</label>
          <input
            type="text"
            formControlName="name"
            class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Descrição</label>
          <textarea
            formControlName="description"
            rows="3"
            class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota resize-none"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1.5">
            <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Preço (R$)</label>
            <input
              type="number"
              step="0.01"
              formControlName="price"
              class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota"
            />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Estoque inicial</label>
            <input
              type="number"
              formControlName="stock"
              class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota"
            />
          </div>
        </div>

        @if (categories().length > 0) {
          <div class="flex flex-col gap-2">
            <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">Categorias</label>
            <div class="flex flex-wrap gap-2">
              @for (category of categories(); track category.id) {
                <button
                  type="button"
                  (click)="toggleCategory(category.id)"
                  class="font-mono text-sm uppercase tracking-wide px-4 py-2 rounded-lg border-2 transition-colors"
                  [class.bg-terracota]="selectedCategoryIds().has(category.id)"
                  [class.text-osso]="selectedCategoryIds().has(category.id)"
                  [class.border-terracota]="selectedCategoryIds().has(category.id)"
                  [class.border-areia]="!selectedCategoryIds().has(category.id)"
                  [class.text-grafite]="!selectedCategoryIds().has(category.id)"
                >
                  {{ category.name }}
                </button>
              }
            </div>
          </div>
        }

        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[11px] tracking-wide uppercase text-grafite/70">URLs de imagem (uma por linha, opcional)</label>
          <textarea
            formControlName="imageUrls"
            rows="2"
            class="font-body border border-areia rounded-lg px-4 py-3 text-grafite focus:outline-none focus:border-terracota resize-none"
          ></textarea>
        </div>

        <button
          type="submit"
          [disabled]="submitting()"
          class="mt-2 font-display uppercase tracking-wide text-base px-7 py-3.5 rounded-lg border-2 border-grafite bg-terracota text-osso font-semibold disabled:opacity-60"
        >
          {{ submitting() ? 'Salvando…' : isEditing() ? 'Salvar alterações' : 'Criar peça' }}
        </button>
      </form>
    }
  </main>
</div>
