<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Jequí</title>
  <base href="/">
  <meta name="theme-color" content="#f7f1e8">
  <meta name="description" content="Jequí, artesanatos do vale — peças e conjuntos de cerâmica feitos à mão no Vale do Jequitinhonha.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon-jequi.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <!-- Splash até o Angular carregar (some sozinho quando o app renderiza).
         Cobre a abertura do site, inclusive o cold start do backend. -->
    <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f7f1e8;font-family:'Hanken Grotesk',system-ui,sans-serif">
      <span style="width:40px;height:40px;border:3px solid #e1dcd3;border-top-color:#224228;border-radius:9999px;animation:jequi-spin .7s linear infinite"></span>
      <span style="font-size:14px;font-weight:500;color:#4a4741">Carregando…</span>
    </div>
    <style>@keyframes jequi-spin{to{transform:rotate(360deg)}}</style>
  </app-root>
</body>
</html>
